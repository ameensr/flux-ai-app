<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32' fill='none'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='32' y2='32' gradientUnits='userSpaceOnUse'%3E%3Cstop offset='0%25' stop-color='%237C5CFF'/%3E%3Cstop offset='50%25' stop-color='%235A7DFF'/%3E%3Cstop offset='100%25' stop-color='%232D8CFF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='14.5' cy='14.5' r='9' stroke='url(%23g)' stroke-width='2.2' fill='none' stroke-linecap='round'/%3E%3Cline x1='23.5' y1='14.5' x2='29' y2='20' stroke='url(%23g)' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Qaly AI Engine | Test Smarter. Ship Faster.</title>
    <meta name="description" content="Qaly AI Engine — Enterprise-grade AI-powered QA productivity platform. Test smarter, ship faster." />
    <meta property="og:title" content="Qaly AI Engine" />
    <meta property="og:description" content="Test Smarter. Ship Faster. The AI engine behind your QA." />
    <meta name="application-name" content="Qaly AI Engine" />
    <!-- Anti-FOUC: apply theme tokens before first paint -->
    <script>
      (function(){
        try {
          var T = {
            dark: {
              '--bg':'#0B1020','--surface':'#111827','--surface-secondary':'#161f30',
              '--surface-elevated':'#1a2235','--text-primary':'#F1F5F9',
              '--text-secondary':'#94A3B8','--text-muted':'#475569',
              '--accent':'#6366F1','--accent-fg':'#ffffff','--accent-hover':'#4F46E5',
              '--border':'rgba(148,163,184,0.1)','--divider':'rgba(148,163,184,0.07)',
              '--card-bg':'rgba(255,255,255,0.03)','--sidebar-bg':'#0f1623',
              '--nav-bg':'rgba(11,16,32,0.9)','--input-bg':'rgba(255,255,255,0.05)',
              '--modal-bg':'#111827','--overlay':'rgba(0,0,0,0.65)',
              '--hover':'rgba(255,255,255,0.05)','--chart-grid':'rgba(148,163,184,0.08)',
              '--chart-text':'#475569','--chart-tooltip-bg':'#1a2235',
              '--shadow':'0 4px 24px rgba(0,0,0,0.35)','--shadow-sm':'0 1px 4px rgba(0,0,0,0.25)',
              '--radius':'12px','--glass-border':'rgba(148,163,184,0.1)'
            },
            light: {
              '--bg':'#F8FAFC','--surface':'#FFFFFF','--surface-secondary':'#F1F5F9',
              '--surface-elevated':'#FFFFFF','--text-primary':'#0F172A',
              '--text-secondary':'#475569','--text-muted':'#94A3B8',
              '--accent':'#6366F1','--accent-fg':'#ffffff','--accent-hover':'#4F46E5',
              '--border':'rgba(15,23,42,0.1)','--divider':'rgba(15,23,42,0.07)',
              '--card-bg':'#FFFFFF','--sidebar-bg':'#FFFFFF',
              '--nav-bg':'rgba(248,250,252,0.92)','--input-bg':'#F8FAFC',
              '--modal-bg':'#FFFFFF','--overlay':'rgba(15,23,42,0.4)',
              '--hover':'rgba(15,23,42,0.04)','--chart-grid':'rgba(15,23,42,0.07)',
              '--chart-text':'#94A3B8','--chart-tooltip-bg':'#FFFFFF',
              '--shadow':'0 1px 8px rgba(15,23,42,0.08),0 4px 24px rgba(15,23,42,0.06)',
              '--shadow-sm':'0 1px 3px rgba(15,23,42,0.08)',
              '--radius':'12px','--glass-border':'rgba(15,23,42,0.1)'
            }
          };
          var raw = localStorage.getItem('qaly-theme') || localStorage.getItem('flux-theme') || 'dark';
          var id = raw === 'light' ? 'light' : 'dark';
          var tokens = T[id];
          var root = document.documentElement;
          for (var k in tokens) root.style.setProperty(k, tokens[k]);
          root.classList.add(id === 'light' ? 'light' : 'dark', 'theme-' + id);
        } catch(e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <div class="noise-overlay"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
